<header class="modulex-blk{{blksinif}}" role="banner">
  {{blkduyuru}}
  <div class="modulex-blk-izgara">
    <a class="modulex-blk-logo" href="/{{lang}}/" aria-label="@home@ - {{web-name}}">
      <img src="/img/{{logo}}" alt="{{web-name}}" loading="eager" decoding="async" />
    </a>
    <nav class="modulex-blk-nav" aria-label="@navigation@">
      <ol>{{blkhucre}}</ol>
    </nav>
    <div class="modulex-blk-dil">{{langbar}}</div>
    {{blkcta}}
    <button class="modulex-blk-ac" type="button" aria-expanded="false" aria-controls="blk-{{id}}-panel" aria-label="@menu-toggle@">
      <span class="modulex-blk-ac-yazi" aria-hidden="true">@menu@</span>
      <span class="material-symbols-outlined modulex-blk-ac-ikon" aria-hidden="true">add</span>
    </button>
  </div>
  <div class="modulex-blk-panel" id="blk-{{id}}-panel" hidden>
    <nav aria-label="@navigation@">
      <ol class="modulex-blk-panel-liste">{{blkpanel}}</ol>
    </nav>
    <div class="modulex-blk-panel-alt">
      {{blkcta}}
      {{langbar}}
    </div>
  </div>
</header>

<style>
  /* menu-blok — hücre ızgarası (15 Kas 2026, G3). Her öğe kalın çizgili kendi hücresinde; büyük harf, geniş aralık, 01·02·03 sayaç
     (CSS counter — metin değil). Aktif hücre ters renk. Panel üstüne binmez, header'ın altında aşağı açılır (akordeon).
     Renkler yalnız desing anahtarından (var(--mx-site-*) varsayılanlı) — koyu mod otomatik; mantıksal CSS → RTL. */
  .modulex-blk {
    position: relative;
    z-index: 50;
    box-sizing: border-box;
    width: 100%;
    background: --bg--;
    color: --text--;
    border-block-end: --cizgi-- solid --text--;
    font-family: var(--mx-font-heading, var(--mx-font-sans, inherit));
  }
  .modulex-blk *,
  .modulex-blk *::before,
  .modulex-blk *::after { box-sizing: border-box; }
  .modulex-blk--sticky { position: sticky; inset-block-start: 0; }

  .modulex-blk-duyuru {
    padding: 8px 16px;
    border-block-end: --cizgi-- solid --text--;
    background: --accent--;
    color: --accentText--;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-align: center;
    text-transform: uppercase;
  }
  .modulex-blk .modulex-blk-duyuru a { color: --accentText-- !important; text-decoration: underline; text-underline-offset: 3px; }

  .modulex-blk-izgara { display: flex; align-items: stretch; min-height: 72px; }
  .modulex-blk-logo {
    display: flex;
    align-items: center;
    flex-shrink: 0;
    padding-inline: 22px;
    border-inline-end: --cizgi-- solid --text--;
  }
  .modulex-blk-logo img {
    display: block;
    height: auto;
    width: auto;
    max-height: --logo_h--;
    max-width: 190px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .modulex-blk-logo img[src*=".svg"] { height: --logo_h--; width: auto; max-width: none; }

  .modulex-blk-nav { flex: 1 1 auto; min-width: 0; display: flex; }
  .modulex-blk-nav ol {
    display: flex;
    flex: 1 1 auto;
    margin: 0;
    padding: 0;
    list-style: none;
    counter-reset: blk;
  }
  .modulex-blk-hucre { flex: 1 1 0; min-width: 0; display: flex; counter-increment: blk; }
  .modulex-blk-hucre + .modulex-blk-hucre { border-inline-start: --cizgi-- solid --text--; }
  .modulex-blk .modulex-blk-oge {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    width: 100%;
    min-height: 44px;
    padding: 10px 14px;
    color: --text--;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    line-height: 1.25;
    text-decoration: none;
    text-transform: uppercase;
    background-image: linear-gradient(--text--, --text--);
    background-repeat: no-repeat;
    background-position: 0 100%;
    background-size: 100% 0;
    cursor: pointer;
    transition: background-size 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), color 0.3s ease;
  }
  .modulex-blk--numara .modulex-blk-oge::before {
    content: counter(blk, decimal-leading-zero);
    font-size: 0.68rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    opacity: 0.6;
    font-variant-numeric: tabular-nums;
  }
  .modulex-blk-ad { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .modulex-blk .modulex-blk-oge:hover,
  .modulex-blk .modulex-blk-oge:focus-visible,
  .modulex-blk .modulex-blk-oge[aria-current="page"] { background-size: 100% 100%; color: --bg-- !important; }
  .modulex-blk .modulex-blk-oge:focus-visible { outline: 3px solid --accent--; outline-offset: -3px; }
  .modulex-blk--tasar .modulex-blk-hucre--fazla { display: none; }

  .modulex-blk-dil {
    display: flex;
    align-items: center;
    flex-shrink: 0;
    padding-inline: 16px;
    border-inline-start: --cizgi-- solid --text--;
  }
  .modulex-blk .modulex-blk-cta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    padding-inline: 22px;
    border-inline-start: --cizgi-- solid --text--;
    background: --accent--;
    color: --accentText-- !important;
    font-size: 0.8rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-decoration: none;
    text-transform: uppercase;
    cursor: pointer;
    transition: padding 0.25s ease, filter 0.25s ease;
  }
  .modulex-blk .modulex-blk-cta:hover { padding-inline: 26px; filter: brightness(1.08); }
  .modulex-blk .modulex-blk-cta:focus-visible { outline: 3px solid --text--; outline-offset: -3px; }

  .modulex-blk-ac {
    display: none;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    min-width: 72px;
    padding-inline: 18px;
    border: 0;
    border-inline-start: --cizgi-- solid --text--;
    background: transparent;
    color: inherit;
    font: inherit;
    font-size: 0.78rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background-color 0.25s ease, color 0.25s ease;
  }
  .modulex-blk--tasar .modulex-blk-ac { display: flex; }
  .modulex-blk-ac:hover,
  .modulex-blk-ac[aria-expanded="true"] { background: --text--; color: --bg--; }
  .modulex-blk-ac:focus-visible { outline: 3px solid --accent--; outline-offset: -3px; }
  .modulex-blk-ac-ikon { transition: transform 0.3s ease; }
  .modulex-blk-ac[aria-expanded="true"] .modulex-blk-ac-ikon { transform: rotate(45deg); }

  .modulex-blk-panel {
    border-block-start: --cizgi-- solid --text--;
    background: --bg--;
    animation: modulex-blk-in 0.3s ease both;
  }
  .modulex-blk-panel[hidden] { display: none; }
  .modulex-blk-panel-liste { margin: 0; padding: 0; list-style: none; counter-reset: blkp; }
  .modulex-blk-panel-liste li { counter-increment: blkp; border-block-end: 1px solid color-mix(in srgb, --text-- 25%, transparent); }
  .modulex-blk .modulex-blk-panel-oge {
    display: flex;
    align-items: center;
    gap: 16px;
    min-height: 60px;
    padding-inline: 22px;
    color: --text--;
    font-size: clamp(1.1rem, 4vw, 1.6rem);
    font-weight: 800;
    letter-spacing: 0.02em;
    text-decoration: none;
    text-transform: uppercase;
    cursor: pointer;
    transition: background-color 0.25s ease, padding 0.25s ease;
  }
  .modulex-blk--numara .modulex-blk-panel-oge::before {
    content: counter(blkp, decimal-leading-zero);
    min-width: 2.2em;
    font-size: 0.8rem;
    font-weight: 500;
    opacity: 0.55;
    font-variant-numeric: tabular-nums;
  }
  .modulex-blk-panel-oge .modulex-blk-ad { flex: 1 1 auto; white-space: normal; overflow-wrap: anywhere; }
  .modulex-blk .modulex-blk-panel-oge:hover,
  .modulex-blk .modulex-blk-panel-oge:focus-visible { background: color-mix(in srgb, --text-- 8%, transparent); padding-inline-start: 30px; }
  .modulex-blk .modulex-blk-panel-oge[aria-current="page"] { background: --text--; color: --bg-- !important; }
  .modulex-blk .modulex-blk-panel-oge:focus-visible { outline: 3px solid --accent--; outline-offset: -3px; }
  .modulex-blk-panel-alt {
    display: flex;
    align-items: stretch;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    padding: 16px 22px;
  }
  .modulex-blk-panel-alt .modulex-blk-cta { min-height: 48px; border: --cizgi-- solid --text--; }

  @keyframes modulex-blk-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

  @media (max-width: 1024px) {
    .modulex-blk-nav,
    .modulex-blk-dil,
    .modulex-blk-izgara > .modulex-blk-cta { display: none; }
    .modulex-blk-ac { display: flex; margin-inline-start: auto; }
    .modulex-blk-izgara { min-height: 64px; }
  }
  @media (max-width: 768px) {
    .modulex-blk-logo { padding-inline: 16px; }
    .modulex-blk-logo img { max-width: 150px; }
    .modulex-blk-ac-yazi { display: none; }
    .modulex-blk-ac { min-width: 64px; justify-content: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-blk * { transition: none !important; animation: none !important; }
    .modulex-blk-panel { animation: none; }
  }
</style>

<script>
  (() => {
    const kok = document.querySelector(".modulex-blk");
    if (!kok || kok.dataset.blkHazir) return;
    kok.dataset.blkHazir = "1";
    const dugme = kok.querySelector(".modulex-blk-ac");
    const panel = kok.querySelector(".modulex-blk-panel");
    const ac = () => { panel.hidden = false; dugme.setAttribute("aria-expanded", "true"); };
    const kapa = (odak) => {
      if (panel.hidden) return;
      panel.hidden = true;
      dugme.setAttribute("aria-expanded", "false");
      if (odak) dugme.focus();
    };
    dugme.addEventListener("click", () => (panel.hidden ? ac() : kapa(false)));
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") kapa(true); });
    document.addEventListener("click", (e) => { if (!kok.contains(e.target)) kapa(false); });
    panel.addEventListener("click", (e) => {
      const a = e.target.closest("a");
      if (a && (a.getAttribute("href") || "").startsWith("#")) kapa(false);
    });
  })();
</script>
